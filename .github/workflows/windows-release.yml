name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt

      - name: Run pre-release regression tests
        run: python -m unittest discover -s tests -v

      - name: Set app version from release tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content -Path app/build_info.py -Value "APP_VERSION = `"$version`"" -Encoding utf8

      - name: Build application folder
        run: python -m PyInstaller --clean --noconfirm VaultHaven.spec

      - name: Prepare third-party license bundle
        shell: pwsh
        run: .\installer\prepare_licenses.ps1

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows setup wizard
        run: iscc.exe "/DBuildVersion=$env:BUILD_VERSION" installer\VaultHaven.iss

      - name: Run clean-install startup smoke test
        shell: pwsh
        run: .\installer\clean-install-smoke-test.ps1 -InstallerPath "dist\installer\VaultHaven-Setup-$env:BUILD_VERSION.exe"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          append_body: true
          body: |
            **Windows security notice:** This installer is not code-signed. Windows SmartScreen may show a warning when you download or run it. Download VaultHaven only from this official GitHub release.
          files: |
            dist/installer/VaultHaven-Setup-${{ env.BUILD_VERSION }}.exe
